name: Instagram 릴스 자동 업로드

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 09:00 KST (UTC 00:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "업로드 없이 생성/캡션만 확인"
        type: boolean
        default: true

permissions:
  contents: write   # posted.json 커밋용

concurrency: reels

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: 릴스 업로드
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VIDEO_PROVIDER: ${{ vars.VIDEO_PROVIDER || 'local' }}
          VIDEO_COMMAND: ${{ vars.VIDEO_COMMAND }}
        run: python -m reels.main ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: 업로드 기록 커밋
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add posted.json videos
          git diff --cached --quiet || (git commit -m "릴스 업로드 기록 갱신" && git push)
